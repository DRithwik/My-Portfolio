<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f2e"/><stop offset="1" stop-color="#0f3b46"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#2dd4bf" stroke-opacity=".08">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800M160 0v450M320 0v450M480 0v450M640 0v450"/>
  </g>
  <!-- heartbeat -->
  <path d="M30 330h160l25-60 30 110 30-150 25 100h500" fill="none" stroke="url(#acc)" stroke-width="4" stroke-linejoin="round" opacity=".55"/>
  <!-- prescription card -->
  <g transform="translate(70 70)">
    <rect width="300" height="210" rx="18" fill="#102a38" stroke="#2dd4bf" stroke-opacity=".4"/>
    <text x="26" y="72" font-family="Georgia,Times New Roman,serif" font-size="50" font-weight="700" font-style="italic" fill="#2dd4bf">Rx</text>
    <rect x="100" y="38" width="160" height="12" rx="6" fill="#5eead4" opacity=".7"/>
    <rect x="100" y="62" width="110" height="10" rx="5" fill="#94a3b8" opacity=".5"/>
    <rect x="28" y="110" width="244" height="10" rx="5" fill="#94a3b8" opacity=".35"/>
    <rect x="28" y="132" width="200" height="10" rx="5" fill="#94a3b8" opacity=".35"/>
    <rect x="28" y="154" width="226" height="10" rx="5" fill="#94a3b8" opacity=".35"/>
    <!-- pill -->
    <g transform="translate(220 160) rotate(-30)"><rect width="64" height="26" rx="13" fill="#f472b6"/><rect width="32" height="26" rx="13" fill="#fbcfe8"/><rect x="20" width="12" height="26" fill="#fbcfe8"/></g>
  </g>
  <!-- blockchain -->
  <g transform="translate(450 70)" fill="#0f2f3d" stroke="#60a5fa" stroke-width="2">
    <rect x="0" y="0" width="80" height="80" rx="12"/>
    <rect x="110" y="0" width="80" height="80" rx="12"/>
    <rect x="220" y="0" width="80" height="80" rx="12" stroke="#2dd4bf"/>
    <path d="M80 40h30M190 40h30" stroke-width="3"/>
    <g fill="#60a5fa" stroke="none" font-family="monospace" font-size="15" text-anchor="middle">
      <text x="40" y="46">#a3f</text><text x="150" y="46">#7c1</text><text x="260" y="46" fill="#2dd4bf">#e09</text>
    </g>
  </g>
  <!-- neural net / AI -->
  <g transform="translate(470 190)">
    <g stroke="#60a5fa" stroke-opacity=".35" stroke-width="1.5">
      <path d="M20 20L120 0M20 20L120 60M20 20L120 120M20 80L120 0M20 80L120 60M20 80L120 120M20 140L120 0M20 140L120 60M20 140L120 120M120 0L230 40M120 60L230 40M120 120L230 40M120 0L230 100M120 60L230 100M120 120L230 100"/>
    </g>
    <g fill="#2dd4bf"><circle cx="20" cy="20" r="9"/><circle cx="20" cy="80" r="9"/><circle cx="20" cy="140" r="9"/></g>
    <g fill="#60a5fa"><circle cx="120" cy="0" r="9"/><circle cx="120" cy="60" r="9"/><circle cx="120" cy="120" r="9"/></g>
    <g fill="#f472b6"><circle cx="230" cy="40" r="10"/><circle cx="230" cy="100" r="10"/></g>
  </g>
  <text x="70" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Rx Appoints</text>
  <text x="290" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#5eead4">AI · NLP · Blockchain</text>
</svg>
