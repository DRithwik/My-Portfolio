<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1205"/><stop offset="1" stop-color="#1a0f24"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/><stop offset=".6" stop-color="#f97316" stop-opacity=".12"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset=".6" stop-color="#fbbf24"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="diya" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- mandala rings -->
  <g transform="translate(220 205)" fill="none" stroke="#f59e0b">
    <circle r="170" fill="url(#halo)" stroke="none"/>
    <circle r="150" stroke-opacity=".18"/><circle r="120" stroke-opacity=".25" stroke-dasharray="3 7"/>
    <g stroke-opacity=".22">
      <path d="M0-150V-120M0 150V120M-150 0H-120M150 0H120M-106-106L-85-85M106 106L85 85M-106 106L-85 85M106-106L85-85"/>
    </g>
    <!-- lotus petals -->
    <g fill="#f59e0b" fill-opacity=".08" stroke-opacity=".35">
      <path d="M0 40C-40 10-40-50 0-90C40-50 40 10 0 40Z"/>
      <path d="M0 40C-40 10-40-50 0-90C40-50 40 10 0 40Z" transform="rotate(45)"/>
      <path d="M0 40C-40 10-40-50 0-90C40-50 40 10 0 40Z" transform="rotate(-45)"/>
      <path d="M0 40C-40 10-40-50 0-90C40-50 40 10 0 40Z" transform="rotate(90)"/>
      <path d="M0 40C-40 10-40-50 0-90C40-50 40 10 0 40Z" transform="rotate(-90)"/>
    </g>
  </g>
  <!-- diya -->
  <g transform="translate(220 230)">
    <path d="M0-120C22-90 26-62 0-40C-26-62-22-90 0-120Z" fill="url(#flame)"/>
    <path d="M0-92C9-78 9-62 0-52C-9-62-9-78 0-92Z" fill="#fffbeb" opacity=".85"/>
    <path d="M-90-30H90C80 20 40 40 0 40C-40 40-80 20-90-30Z" fill="url(#diya)"/>
    <path d="M-90-30H90" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M90-30C105-35 115-30 118-22" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- scripture panel -->
  <g transform="translate(450 70)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="300" height="270" rx="16" fill="#2b1608" fill-opacity=".85" stroke="#f59e0b" stroke-opacity=".4"/>
    <text x="24" y="40" font-size="13" letter-spacing="2" fill="#fbbf24">SACRED TEXTS</text>
    <g fill="#fcd34d" opacity=".55"><rect x="24" y="58" width="230" height="9" rx="4"/><rect x="24" y="76" width="190" height="9" rx="4"/></g>
    <text x="24" y="126" font-size="13" letter-spacing="2" fill="#fbbf24">PHILOSOPHY SCHOOLS</text>
    <g fill="#fcd34d" opacity=".4"><rect x="24" y="144" width="250" height="9" rx="4"/><rect x="24" y="162" width="160" height="9" rx="4"/></g>
    <text x="24" y="212" font-size="13" letter-spacing="2" fill="#fbbf24">SAGES · TATTVAJÑA</text>
    <g fill="#fcd34d" opacity=".4"><rect x="24" y="230" width="210" height="9" rx="4"/></g>
  </g>
  <text x="60" y="418" font-family="Georgia,Times New Roman,serif" font-size="38" font-weight="700" fill="#fde68a">Atma Gyan</text>
  <text x="300" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#fdba74">Sanātana Dharma knowledge hub</text>
</svg>
