  <text x="60" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Deep Research AI Agent</text>
  <text x="470" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#93c5fd">Search → Reason → Report</text>
