    <!-- bar chart -->
    <g fill="#3b82f6"><rect x="34" y="200" width="28" height="40" rx="4" opacity=".6"/><rect x="74" y="170" width="28" height="70" rx="4" opacity=".75"/><rect x="114" y="150" width="28" height="90" rx="4"/><rect x="154" y="185" width="28" height="55" rx="4" opacity=".7"/></g>
